<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>生日快乐｜永远童心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f7e9dc 0%, #efe2d3 50%, #e8d9c8 100%);
            overflow-x: hidden;
            color: #6b4f3b;
        }
        .lock-wrap {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            background: #f7e9dc;
            z-index: 999;
        }
        .lock-box {
            background: #fff8f0;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(139, 90, 55, 0.25);
            text-align: center;
        }
        .lock-box h2 {
            color: #915c40;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .lock-box input {
            width: 220px;
            padding: 12px 16px;
            border: 1px solid #d4b8a0;
            border-radius: 12px;
            font-size: 18px;
            text-align: center;
            outline: none;
            margin-bottom: 16px;
        }
        .lock-box button {
            width: 220px;
            padding: 12px;
            background: #915c40;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            cursor: pointer;
        }
        .error {
            color: #c84b4b;
            margin-top: 10px;
            display: none;
        }
        .main-page {
            display: none;
        }
        .float {
            position: fixed;
            font-size: 40px;
            opacity: 0.55;
            animation: floatUp linear infinite;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% {transform: translateY(110vh) rotate(0deg);opacity: 0;}
            10% {opacity: 0.6;}
            90% {opacity: 0.4;}
            100% {transform: translateY(-120px) rotate(360deg);opacity: 0;}
        }
        .container {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 460px;
            margin: 0 auto;
            padding: 40px 18px 60px;
            text-align: center;
        }
        .cake {
            font-size: 96px;
            margin-bottom: 10px;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% {transform: translateY(0);}
            50% {transform: translateY(-12px);}
        }
        h1 {
            font-size: 30px;
            color: #915c40;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(160, 110, 75, 0.35);
        }
        .sub {
            font-size: 15px;
            color: #8c6b56;
            margin-bottom: 24px;
        }

        /* ==========10张图 CSS轮播========== */
        .swiper-wrap {
            background: #fff8f0;
            border-radius: 28px;
            padding: 14px;
            box-shadow: 0 10px 25px rgba(139, 90, 55, 0.25);
            margin-bottom: 24px;
            overflow: hidden;
        }
        .swiper {
            width: 100%;
            overflow: hidden;
        }
        .swiper-inner {
            display: flex;
            animation: slide 45s infinite ease;
        }
        .swiper-item {
            flex-shrink: 0;
            width: 100%;
			height: 500px;
        }
        .swiper-item img {
            width: 100%;
            border-radius: 20px;
            display: block;
            filter: sepia(35%) saturate(90%);
        }
        @keyframes slide {
            0%,8%{transform:translateX(0%);}
            10%,18%{transform:translateX(-100%);}
            20%,28%{transform:translateX(-200%);}
            30%,38%{transform:translateX(-300%);}
            40%,48%{transform:translateX(-400%);}
            50%,58%{transform:translateX(-500%);}
            60%,68%{transform:translateX(-600%);}
            70%,78%{transform:translateX(-700%);}
            80%,88%{transform:translateX(-800%);}
            90%,98%{transform:translateX(-900%);}
            100%{transform:translateX(0%);}
        }
        .dots {
            display: flex;
            gap: 6px;
            flex-wrap:wrap;
            justify-content: center;
            margin-top:12px;
        }
        .dot {
            width:8px;
            height:8px;
            border-radius:50%;
            background:#d4b8a0;
        }

        .wish-card {
            background: rgba(255, 252, 248, 0.88);
            border-radius: 26px;
            padding: 24px 18px;
            box-shadow: 0 12px 30px rgba(139, 90, 55, 0.22);
            margin-bottom: 22px;
            border: 2px dashed #d4b8a0;
        }
        .wish-card h2 {
            font-size: 20px;
            color: #915c40;
            margin-bottom: 14px;
        }
        .main-text {
            font-size: 22px;
            font-weight: bold;
            color: #824b32;
            line-height: 1.6;
            margin-bottom: 18px;
        }
        .other-text {
            font-size: 16px;
            color: #705342;
            line-height: 1.9;
            text-align: left;
        }
        .music-box {
            background: #fff8f0;
            border-radius: 22px;
            padding: 18px;
            box-shadow: 0 8px 20px rgba(139, 90, 55, 0.22);
            margin-bottom: 20px;
        }
        .music-title {
            font-size: 15px;
            color: #8c6b56;
            margin-bottom: 10px;
        }
        audio {
            width: 100%;
            border-radius: 30px;
        }
        .tip {
            font-size: 13px;
            color: #a08470;
            margin-top: 10px;
        }
        .bottom-wish {
            font-size: 16px;
            color: #705342;
            line-height: 1.8;
            margin-top: 10px;
        }
        .heart {
            position: fixed;
            font-size: 24px;
            animation: heartFall linear infinite;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes heartFall {
            0% {transform: translateY(-40px) rotate(0deg);opacity: 0;}
            10% {opacity: 0.7;}
            90% {opacity: 0.5;}
            100% {transform: translateY(110vh) rotate(360deg);opacity: 0;}
        }
    </style>
</head>
<body>
    <div class="lock-wrap" id="lockPage">
        <div class="lock-box">
            <h2>Action day</h2>
            <input type="password" id="pwdInput" placeholder="请输入访问密码">
            <button onclick="checkPwd()">进入页面</button>
            <div class="error" id="err">密码错误，请重新输入</div>
        </div>
    </div>

    <div class="main-page" id="main">
        <div class="container">
            <div class="cake">🎂</div>
            <h1>生日快乐呀</h1>
            <p class="sub">愿扣妹，永远被爱 ✨</p >

            <div class="swiper-wrap">
                <div class="swiper">
                    <div class="swiper-inner">
                        <div class="swiper-item"><img src="1.jpg" alt="" style="height: 500px;"></div>
                        <div class="swiper-item"><img src="2.jpg" alt="" style="height: 500px;"></div>
                        <div class="swiper-item"><img src="3.jpg" alt="" style="height: 500px;" ></div>
                        <div class="swiper-item"><img src="4.jpg" alt="" style="height: 500px;"></div>
                        <div class="swiper-item"><img src="5.jpg" alt="" style="height: 500px;"></div>
                        <div class="swiper-item"><img src="6.jpg" alt="" style="height: 500px;"></div>
                        <div class="swiper-item"><img src="7.jpg" alt="" style="height: 500px;"></div>
                        <div class="swiper-item"><img src="8.jpg" alt="" style="height: 500px;"></div>
                        <div class="swiper-item"><img src="9.jpg" alt="" style="height: 500px;"></div>
                        <div class="swiper-item"><img src="10.jpg" alt="" ></div>
                    </div>
                </div>
                <div class="dots">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
                </div>
            </div>

            <div class="wish-card">
                <h2>今日祝福</h2>
                <p class="main-text">
                    时间偷走的年龄<br>
                    让你始终保持一颗童心
                </p >
                <p class="other-text">
                    愿你新的一岁里，<br>
                    心里有童话，眼里有星光，<br>
                    永远像小朋友一样，<br>
                    开心、勇敢、被温柔包围。<br><br>
                    生日快乐 🎈
                </p >
            </div>

            <div class="music-box">
                <p class="music-title">🎵</p >
                <audio id="birthdayMusic" controls loop>
                    <source src="heart.mp3" type="audio/mpeg" />
                    您的浏览器不支持音频播放。
                
                <p class="tip">自动循环播放，可手动暂停</p >
            </div>

            <p class="bottom-wish">
                不止生日这一天，<br>
                愿你往后的每一天都快乐。
            </p >
        </div>
    </div>

<script>
const PASSWD = "1101";
function checkPwd(){
    const val = document.getElementById('pwdInput').value.trim();
    if(val === PASSWD){
        document.getElementById('lockPage').style.display = 'none';
        document.getElementById('main').style.display = 'block';
    }else{
        document.getElementById('err').style.display = 'block';
    }
}
document.getElementById('pwdInput').addEventListener('keydown',e=>{
    if(e.key === 'Enter') checkPwd();
})

function createFloat() {
    const arr = ['🎈', '⭐', '🎀', '💫', '🍰'];
    const el = document.createElement('div');
    el.className = 'float';
    el.textContent = arr[Math.floor(Math.random() * arr.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (Math.random() * 25 + 25) + 'px';
    el.style.animationDuration = (Math.random() * 8 + 8) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 16000);
}
function createHeart() {
    const el = document.createElement('div');
    el.className = 'heart';
    el.textContent = '🤎';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (Math.random() * 6 + 6) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 13000);
}
setInterval(createFloat,900);
setInterval(createHeart,700);

const music = document.getElementById('birthdayMusic');
document.body.addEventListener('click',()=>{
    music.play().catch(()=>{})
},{once:true})
</script>
</body>
</html>
